name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests with branch coverage
        run: |
          python -m pytest \
            --junitxml=reports/junit.xml \
            --cov-report=xml:reports/coverage.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Chromium acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Install browser test tools
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install and verify Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          fc-cache --force
          fc-match -f '%{family}\n' 'Noto Sans CJK JP' | grep 'Noto Sans CJK JP'

      - name: Run browser quality gate
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-browser-chromium
          path: |
            reports/cucumber/
            reports/browser/
          if-no-files-found: warn
          retention-days: 14
