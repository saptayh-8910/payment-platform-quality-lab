<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="pq-map-title pq-map-desc">
    <title id="pq-map-title">Payment simulator architecture</title>
    <desc id="pq-map-desc">English and Japanese checkout exchanges requests and responses with the FastAPI payment service. The service reads and writes SQLite. Stored events feed signed webhook delivery to an in-process merchant simulator. Reconciliation compares stored evidence. These are logical components, not separate deployed services.</desc>
    <style>
text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;}
.pq-node{fill:#f6f8fa;stroke:#ced7e5;stroke-width:1.2;}
.pq-core{fill:#edf2ff;stroke:#3052bc;stroke-width:1.4;}
.pq-title{fill:#1f2328;font-size:20px;font-weight:600;}
.pq-sub{fill:#536176;font-size:17px;}
.pq-edge-label{fill:#3052bc;font-size:15px;}
.pq-edge{fill:none;stroke:#3052bc;stroke-width:1.7;marker-end:url(#pq-arrow);}
.pq-return{stroke-dasharray:4 4;}
</style>
<rect x="1" y="1" width="818" height="618" rx="10" fill="#ffffff" stroke="#ced7e5"/>
<text x="24" y="31" fill="#3052bc" font-size="16" font-weight="600">Payment Platform Quality Lab</text>
<text x="796" y="31" fill="#536176" font-size="12" text-anchor="end">LOGICAL OVERVIEW · LOCAL SIMULATOR</text>
