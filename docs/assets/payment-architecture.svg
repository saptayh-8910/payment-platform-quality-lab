    <text class="pq-title" x="409" y="104" text-anchor="middle">Payment service</text><text class="pq-sub" x="409" y="135" text-anchor="middle">Python · FastAPI</text>
    <rect class="pq-node" x="586" y="62" width="208" height="112" rx="10"/>
    <text class="pq-title" x="690" y="94" text-anchor="middle">SQLite</text><text class="pq-sub" x="690" y="122" text-anchor="middle">Payments · Ledger</text><text class="pq-sub" x="690" y="146" text-anchor="middle">Receipts · Events</text>
    <path class="pq-edge" d="M232 93 H305"/><text class="pq-edge-label" x="268" y="80" text-anchor="middle">Request</text>
    <path class="pq-edge pq-return" d="M305 145 H232"/><text class="pq-edge-label" x="268" y="166" text-anchor="middle">Response</text>
    <path class="pq-edge" d="M513 93 H586"/><text class="pq-edge-label" x="549" y="80" text-anchor="middle">Write</text>
    <path class="pq-edge pq-return" d="M586 145 H513"/><text class="pq-edge-label" x="549" y="166" text-anchor="middle">Read</text>
    <path class="pq-edge" d="M690 174 V274"/><text class="pq-edge-label" x="705" y="216">Stored</text><text class="pq-edge-label" x="705" y="237">events</text>
    <rect class="pq-node" x="586" y="274" width="208" height="108" rx="10"/>
    <text class="pq-title" x="690" y="317" text-anchor="middle">Webhook delivery</text><text class="pq-sub" x="690" y="347" text-anchor="middle">Sign · Retry</text>
    <rect class="pq-node" x="305" y="274" width="208" height="108" rx="10"/>
